<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006b4e"><title>Book de vente — Cour matériaux, Jardin & Bâti | Calais</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#193d2d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:620px;margin:18vh auto;padding:40px;text-align:center;background:white;border-radius:22px;box-shadow:0 12px 45px #15442917}
h1{font-size:27px;line-height:1.2}p{color:#607467;line-height:1.6}.progress{width:100%;height:9px;border-radius:9px;background:#e2ece4;overflow:hidden;margin:24px 0}.bar{height:100%;background:#007c52;width:0%;transition:width .2s}
button{border:none;border-radius:10px;background:#007c52;color:white;padding:12px 18px;font-weight:700;cursor:pointer}
</style></head>
<body><main>
<div style="font-size:14px;letter-spacing:.15em;font-weight:900;color:#08774f">LEROY MERLIN · CALAIS</div>
<h1>Book de vente<br>Cour matériaux · Jardin &amp; Bâti</h1>
<p id="message">Chargement des 190 références, photos, croquis et codes-barres…</p>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="details">Préparation du catalogue autonome</p>
<button id="retry" hidden onclick="location.reload()">Réessayer le chargement</button>
</main>
<script>
(async()=>{
  const COUNT=15;
  const paths=Array.from({length:COUNT},(_,i)=>'content/part-'+String(i).padStart(2,'0')+'.txt');
  const set=(n)=>{document.getElementById('bar').style.width=Math.round(n/COUNT*100)+'%';document.getElementById('details').textContent=n+' / '+COUNT+' parties chargées';};
  let count=0;
  try {
    const data=await Promise.all(paths.map(async(path)=>{
      const r=await fetch(path,{cache:'default'});
      if(!r.ok)throw Error(path+' : erreur HTTP '+r.status);
      const t=await r.text();set(++count);return t;
    }));
    let html=data.join('');
    if(!/^\s*<!doctype html>/i.test(html)||!html.includes('</html>')||html.length<10000000)throw Error('Catalogue incomplet');
    // Les deux liens historiques pointaient vers des PDF non hébergés.
    // Les remplacer par l'export PDF actualisé par rayon.
    html=html.replace('href="Book_de_vente_Bati_Materiaux_Calais.pdf" download','href="#" onclick="event.preventDefault(); document.getElementById(\'printBatiBtn\').click()"')
      .replace('href="Book_de_vente_Jardin_Calais.pdf" download','href="#" onclick="event.preventDefault(); document.getElementById(\'printJardinBtn\').click()"')
      .replace('PDF Bâti (édition initiale)','Générer le PDF Bâti')
      .replace('PDF Jardin (édition initiale)','Générer le PDF Jardin');
    // Charger les sous-rayons couleurs après le catalogue, sans toucher aux données produit.
    html=html.replace('</body>','<script src="print-intercalaires.js"><'+'/script></body>');
    document.open();document.write(html);document.close();
  } catch(e){
    document.getElementById('message').textContent='Le book n’a pas pu se charger complètement.';
    document.getElementById('details').textContent=String(e.message||e);
    document.getElementById('retry').hidden=false;
  }
})();
</script></body></html>
